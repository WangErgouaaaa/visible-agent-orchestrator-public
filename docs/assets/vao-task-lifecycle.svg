<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="vaoFlowTitle vaoFlowDesc">
  <title id="vaoFlowTitle">How one task flows through Visible Agent Orchestrator</title>
  <desc id="vaoFlowDesc">Task lifecycle stacked vertically: organize defines and scopes the task; work runs in a bound pane and produces a report with one terminal marker; independent review reads the diff against the contract; the organizer accepts or assigns repairs. A marker alone is not acceptance.</desc>
  <defs>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <rect x="2" y="2" width="476" height="636" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text class="sans" x="48" y="52" font-size="22" font-weight="700" fill="#0f172a">How one task flows</text>
  <text class="sans" x="48" y="74" font-size="15.5" fill="#475569">organizer → worker</text>
  <text class="sans" x="48" y="94" font-size="15.5" fill="#475569">→ independent reviewer → organizer acceptance</text>

  <!-- Stage 1: Organize -->
  <rect x="24" y="104" width="432" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="142" r="16" fill="#4f46e5"/>
  <text class="sans" x="56" y="147.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text class="sans" x="84" y="142" font-size="19" font-weight="700" fill="#0f172a">Organize</text>
  <text class="sans" x="84" y="166" font-size="15.5" fill="#475569">define and scope the task</text>

  <line x1="240" y1="196" x2="240" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#flowArrow)"/>
  <text class="sans" x="256" y="212" font-size="15.5" fill="#475569">dispatch</text>

  <!-- Stage 2: Work -->
  <rect x="24" y="226" width="432" height="86" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <circle cx="56" cy="264" r="16" fill="#059669"/>
  <text class="sans" x="56" y="269.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text class="sans" x="84" y="264" font-size="19" font-weight="700" fill="#0f172a">Work</text>
  <text class="sans" x="84" y="288" font-size="15.5" fill="#475569">bound pane · report + one marker</text>

  <line x1="240" y1="318" x2="240" y2="342" stroke="#64748b" stroke-width="3" marker-end="url(#flowArrow)"/>
  <text class="sans" x="256" y="334" font-size="15.5" fill="#475569">deliver</text>

  <!-- Stage 3: Independent review -->
  <rect x="24" y="348" width="432" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="386" r="16" fill="#0284c7"/>
  <text class="sans" x="56" y="391.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text class="sans" x="84" y="386" font-size="19" font-weight="700" fill="#0f172a">Independent review</text>
  <text class="sans" x="84" y="410" font-size="15.5" fill="#475569">reads the diff against the contract</text>

  <line x1="240" y1="440" x2="240" y2="464" stroke="#64748b" stroke-width="3" marker-end="url(#flowArrow)"/>
  <text class="sans" x="256" y="456" font-size="15.5" fill="#475569">verdict</text>

  <!-- Stage 4: Accept -->
  <rect x="24" y="470" width="432" height="86" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <circle cx="56" cy="508" r="16" fill="#7c3aed"/>
  <text class="sans" x="56" y="513.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text class="sans" x="84" y="508" font-size="19" font-weight="700" fill="#0f172a">Accept</text>
  <text class="sans" x="84" y="532" font-size="15.5" fill="#475569">leader reads evidence, decides</text>

  <!-- Completion vs acceptance -->
  <rect x="24" y="580" width="432" height="48" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="sans" x="240" y="609" font-size="17" font-weight="700" fill="#3730a3" text-anchor="middle">a marker alone ≠ acceptance</text>
</svg>

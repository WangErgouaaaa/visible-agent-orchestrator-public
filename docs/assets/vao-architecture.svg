<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="vaoArchTitle vaoArchDesc">
  <title id="vaoArchTitle">Visible Agent Orchestrator at a glance</title>
  <desc id="vaoArchDesc">Vertical overview: the organizer defines tasks and accepts results; the VAO control plane holds task contracts, worker binding, locks and fencing, and receipts with markers; tasks are delivered to bound tmux panes and reports with one terminal marker come back.</desc>
  <defs>
    <marker id="archArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <rect x="2" y="2" width="476" height="616" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Organizer -->
  <rect x="40" y="28" width="400" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="86" cy="76" r="22" fill="#0f172a"/>
  <text class="sans" x="86" y="81" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">You</text>
  <text class="sans" x="124" y="70" font-size="20" font-weight="700" fill="#0f172a">the organizer</text>
  <text class="sans" x="124" y="94" font-size="15.5" fill="#64748b">defines tasks · accepts results</text>

  <line x1="240" y1="128" x2="240" y2="180" stroke="#64748b" stroke-width="3" marker-end="url(#archArrow)"/>
  <text class="sans" x="256" y="158" font-size="16" fill="#475569">dispatch task</text>

  <!-- Control plane -->
  <rect x="40" y="188" width="400" height="236" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <path d="M 40 204 Q 40 188 56 188 L 424 188 Q 440 188 440 204 L 440 252 L 40 252 Z" fill="#4f46e5"/>
  <text class="sans" x="240" y="218" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">VAO control plane</text>
  <text class="sans" x="240" y="242" font-size="15" fill="#e0e7ff" text-anchor="middle">authority lives outside the worker</text>

  <rect x="56" y="268" width="176" height="64" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="sans" x="144" y="306" font-size="16.5" font-weight="700" fill="#3730a3" text-anchor="middle">task contracts</text>
  <rect x="248" y="268" width="176" height="64" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="sans" x="336" y="306" font-size="16.5" font-weight="700" fill="#3730a3" text-anchor="middle">worker binding</text>
  <rect x="56" y="344" width="176" height="64" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="sans" x="144" y="382" font-size="16.5" font-weight="700" fill="#3730a3" text-anchor="middle">locks &amp; fencing</text>
  <rect x="248" y="344" width="176" height="64" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text class="sans" x="336" y="382" font-size="16.5" font-weight="700" fill="#3730a3" text-anchor="middle">receipts &amp; markers</text>

  <line x1="140" y1="434" x2="140" y2="482" stroke="#64748b" stroke-width="3" marker-end="url(#archArrow)"/>
  <text class="sans" x="156" y="463" font-size="15.5" fill="#475569">task</text>
  <line x1="340" y1="482" x2="340" y2="434" stroke="#64748b" stroke-width="3" marker-end="url(#archArrow)"/>
  <text class="sans" x="324" y="463" font-size="15" fill="#475569" text-anchor="end">report + marker</text>

  <!-- Terminal -->
  <rect x="40" y="492" width="400" height="112" rx="14" fill="#0f172a"/>
  <circle cx="60" cy="514" r="4.5" fill="#22c55e"/>
  <circle cx="76" cy="514" r="4.5" fill="#f59e0b"/>
  <circle cx="92" cy="514" r="4.5" fill="#ef4444"/>
  <text class="mono" x="240" y="519" font-size="15" fill="#94a3b8" text-anchor="middle">tmux · visible workers</text>

  <rect x="56" y="534" width="116" height="56" rx="10" fill="#1e293b"/>
  <text class="mono" x="114" y="568" font-size="16" font-weight="700" fill="#7dd3fc" text-anchor="middle">worker-a</text>
  <rect x="180" y="534" width="116" height="56" rx="10" fill="#1e293b"/>
  <text class="mono" x="238" y="568" font-size="16" font-weight="700" fill="#7dd3fc" text-anchor="middle">worker-b</text>
  <rect x="304" y="534" width="116" height="56" rx="10" fill="#1e293b"/>
  <text class="mono" x="362" y="568" font-size="16" font-weight="700" fill="#7dd3fc" text-anchor="middle">worker-c</text>
</svg>
